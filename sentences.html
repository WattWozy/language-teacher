<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grammar Inspector</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f0f2f5;
    padding: 20px;
    color: #333;
    min-height: 100vh;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    padding: 2rem;
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
}
h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 1.5rem;
}
.controls {
    margin-bottom: 30px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}
select {
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 20px;
    border: 2px solid #e0e0e0;
    outline: none;
    transition: border-color 0.2s;
    background-color: white;
    cursor: pointer;
}
select:focus {
    border-color: #5352ed;
}
.back-btn {
    display: inline-flex;
    align-items: center;
    margin-bottom: 20px;
    text-decoration: none;
    color: #5352ed;
    font-weight: bold;
    padding: 10px 20px;
    background: rgba(83, 82, 237, 0.1);
    border-radius: 20px;
    transition: all 0.2s;
}
.back-btn:hover { 
    background: #5352ed;
    color: white;
}

/* Specific to Grammar Inspector */
.section {
    margin-top: 30px;
}
.section-title {
    font-weight: 700;
    margin-bottom: 10px;
    color: #5352ed;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 1.1em;
}
.tokens {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.token {
    padding: 8px 14px;
    border-radius: 14px;
    background: #f3f3f3;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
}
.token:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}
.token.active {
    border-color: #5352ed;
    background: #e8eaf6;
}
.role-VERB { background:#ffdddd; }
.role-nsubj { background:#dde8ff; }
.role-obj { background:#ddffdd; }

.panel {
    background: #f8f9fa;
    border-radius: 16px;
    padding: 20px;
    margin-top: 10px;
    border: 1px solid rgba(0,0,0,0.05);
}
svg {
    width: 100%;
    height: 300px;
    overflow: visible;
}
.tree-text {
    font-size: 14px;
    fill: #2c3e50;
}
.tree-label {
    font-size: 11px;
    fill: #5352ed;
    font-weight: bold;
}
@media (prefers-color-scheme: dark) {
    .tree-text { fill: #e0e0e0; }
    .tree-label { fill: #81c784; }
}
.toggle-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    background: #f8f9fa;
    padding: 15px;
    border-radius: 16px;
}
.toggle-group label {
    font-size: 0.95em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
}
.timeline {
    position: relative;
    height: 50px;
    background: #eee;
    border-radius: 12px;
    overflow: hidden;
}
.timeline-bar {
    position: absolute;
    height: 100%;
    background: #5352ed;
    border-radius: 12px;
    transition: all 0.3s ease;
}

@media (prefers-color-scheme: dark) {
    body {
        background-color: #121212;
        color: #e0e0e0;
    }
    .container {
        background: #1e1e1e;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    h1 { color: #ecf0f1; }
    select {
        background-color: #2d2d2d;
        border-color: #404040;
        color: white;
    }
    .panel { background: #2d2d2d; border-color: #404040; }
    .token { background: #2d2d2d; color: #e0e0e0; }
    .timeline { background: #333; }
    .toggle-group { background: #2d2d2d; }
    .back-btn {
        background: rgba(255, 255, 255, 0.1);
        color: #e0e0e0;
    }
    .back-btn:hover {
        background: #5352ed;
        color: white;
    }
    .section-title { color: #81c784; }
}
</style>
</head>

<body>
<div class="container">
    <a href="client.html" class="back-btn">← Back to Assistant</a>
    <h1>Grammar Inspector</h1>

    <div class="controls">
        <label for="langSelect" style="font-weight:bold; margin-right:5px;">Language:</label>
        <select id="langSelect" style="margin-right: 20px;"></select>
        
        <label for="sentenceSelect" style="font-weight:bold; margin-right:5px;">Sentence:</label>
        <select id="sentenceSelect"></select>
    </div>

    <div class="section">
        <div class="section-title">View Toggles</div>
        <div class="toggle-group">
            <label><input type="checkbox" checked onchange="toggle('tokens')"> Tokens</label>
            <label><input type="checkbox" checked onchange="toggle('tree')"> Dependency Tree</label>
            <label><input type="checkbox" checked onchange="toggle('timeline')"> Tense Timeline</label>
            <label><input type="checkbox" checked onchange="toggle('slots')"> Slots</label>
            <label><input type="checkbox" checked onchange="toggle('morph')"> Morphology</label>
        </div>
    </div>

    <!-- TOKENS -->
    <div id="tokens" class="section">
        <div class="section-title">Sentence Tokens</div>
        <div id="tokenRow" class="tokens"></div>
        <div id="tokenInfo" class="panel"></div>
    </div>

    <!-- TREE -->
    <div id="tree" class="section">
        <div class="section-title">Dependency Tree</div>
        <svg id="treeSvg"></svg>
    </div>

    <!-- TIMELINE -->
    <div id="timeline" class="section">
        <div class="section-title">Tense / Aspect</div>
        <div class="timeline">
            <div id="timelineBar" class="timeline-bar"></div>
        </div>
    </div>

    <!-- SLOTS -->
    <div id="slots" class="section">
        <div class="section-title">Sentence Slots</div>
        <div id="slotView" class="panel"></div>
    </div>

    <!-- MORPH -->
    <div id="morph" class="section">
        <div class="section-title">Morphology</div>
        <div id="morphView" class="panel">Click a token</div>
    </div>
</div>

<script>
let sentences = [];
let activeSentence = null;
let activeToken = null;

function toggle(id) {
    document.getElementById(id).style.display =
        document.getElementById(id).style.display === 'none' ? '' : 'none';
}

async function init() {
    try {
        const langRes = await fetch('http://localhost:8000/sentences');
        const languages = await langRes.json();
        
        const langSel = document.getElementById('langSelect');
        languages.forEach(lang => {
            const opt = document.createElement('option');
            opt.value = lang;
            opt.textContent = lang.toUpperCase();
            langSel.appendChild(opt);
        });
        
        langSel.onchange = () => loadData(langSel.value);
        
        if (languages.length > 0) {
            loadData(languages[0]);
        }
    } catch (e) {
        console.error("Failed to init languages", e);
    }
}

async function loadData(lang) {
    const res = await fetch(`http://localhost:8000/sentences/${lang}.json`);
    sentences = await res.json();

    const sel = document.getElementById('sentenceSelect');
    sel.innerHTML = '';
    sentences.forEach((s,i)=>{
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = s.text;
        sel.appendChild(opt);
    });
    sel.onchange = () => setSentence(sentences[sel.value]);
    setSentence(sentences[0]);
}

function setSentence(sentence) {
    activeSentence = sentence;
    renderTokens();
    renderTree();
    renderTimeline();
    renderSlots();
}

function renderTokens() {
    const row = document.getElementById('tokenRow');
    row.innerHTML = '';
    activeSentence.tokens.forEach((t,i)=>{
        const el = document.createElement('div');
        el.className = `token role-${t.dep === 'root' ? 'VERB' : t.dep}`;
        el.textContent = t.text;
        el.onclick = ()=>selectToken(t);
        row.appendChild(el);
    });
}

function selectToken(t) {
    activeToken = t;
    document.getElementById('tokenInfo').innerHTML = `
        <b>${t.text}</b><br>
        Lemma: ${t.lemma}<br>
        POS: ${t.pos}<br>
        Tense: ${t.tense || '-'}<br>
        Person: ${t.person || '-'}
    `;
    renderMorphology();
}

function renderTree() {
    const svg = document.getElementById('treeSvg');
    svg.innerHTML = '';
    
    // Arrowhead definition
    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    defs.innerHTML = `
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
        refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#5352ed" />
        </marker>
    `;
    svg.appendChild(defs);

    const w = svg.clientWidth;
    const h = svg.clientHeight;
    const tokens = activeSentence.tokens;
    const step = w / (tokens.length + 1);
    const textY = h - 40;

    // Draw Arcs
    tokens.forEach((t, i) => {
        if (t.head !== null && t.head !== undefined) {
            const startX = (t.head + 1) * step;
            const endX = (i + 1) * step;
            
            // Calculate height based on distance
            const dist = Math.abs(t.head - i);
            const arcHeight = 40 + (dist * 20);
            const midX = (startX + endX) / 2;
            const midY = textY - arcHeight;

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${startX} ${textY - 20} Q ${midX} ${midY} ${endX} ${textY - 20}`);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "#5352ed");
            path.setAttribute("stroke-width", "1.5");
            path.setAttribute("marker-end", "url(#arrowhead)");
            path.style.opacity = "0.8";
            svg.appendChild(path);

            // Label
            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", midX);
            label.setAttribute("y", midY - 5);
            label.setAttribute("text-anchor", "middle");
            label.setAttribute("class", "tree-label");
            label.textContent = t.dep;
            svg.appendChild(label);
        }
    });

    // Draw Words
    tokens.forEach((t, i) => {
        const x = (i + 1) * step;
        
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", x);
        text.setAttribute("y", textY);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("class", "tree-text");
        text.style.fontWeight = "bold";
        text.textContent = t.text;
        svg.appendChild(text);

        const pos = document.createElementNS("http://www.w3.org/2000/svg", "text");
        pos.setAttribute("x", x);
        pos.setAttribute("y", textY + 20);
        pos.setAttribute("text-anchor", "middle");
        pos.setAttribute("fill", "#95a5a6");
        pos.setAttribute("font-size", "12px");
        pos.textContent = t.pos;
        svg.appendChild(pos);
    });
}

function renderTimeline() {
    const verb = activeSentence.tokens.find(t=>t.dep==='root');
    const bar = document.getElementById('timelineBar');
    bar.style.left = verb.tense === 'PAST' ? '0%' : verb.tense === 'FUTURE' ? '60%' : '30%';
    bar.style.width = '30%';
}

function renderSlots() {
    const subj = activeSentence.tokens.find(t=>t.dep==='nsubj');
    const verb = activeSentence.tokens.find(t=>t.dep==='root');
    const obj = activeSentence.tokens.find(t=>t.dep==='obj');
    document.getElementById('slotView').innerHTML = `
        [SUBJECT] ${subj?.text || '—'}<br>
        [VERB] ${verb?.text || '—'}<br>
        [OBJECT] ${obj?.text || '—'}
    `;
}

function renderMorphology() {
    document.getElementById('morphView').innerHTML = `
        <b>${activeToken.text}</b><br>
        ${activeToken.lemma} + <i>(morphology TODO)</i>
    `;
}

init();
</script>
</body>
</html>
